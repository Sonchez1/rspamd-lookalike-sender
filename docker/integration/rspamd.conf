# Minimal, self-contained Rspamd config for the integration test. It loads ONLY the
# lookalike_sender plugin (no DNS/redis/stock modules), so a scan runs just our callback.

options {
  pidfile = "/tmp/rspamd.pid";
  filters = "";
  disable_hyperscan = true;
}

logging {
  type = "console";
  level = "error";
}

worker "normal" {
  bind_socket = "127.0.0.1:11333";
  count = 1;
}

worker "controller" {
  bind_socket = "127.0.0.1:11334";
  count = 1;
  password = "test";
  secure_ip = "127.0.0.1";
}

actions {
  reject = 15;
  add_header = 6;
  greylist = 4;
}

# Load the plugin and point the Lua path at the bundled library.
lua = "/work/docker/integration/rspamd.local.lua";

# Operator-configured protected set for the test.
lookalike_sender {
  protected = ["linkedin.com", "LinkedIn", "paypal.com", "PayPal", "nsu.example", "NSU", "google.com", "Google"];
  score_threshold = 0.5;
}
